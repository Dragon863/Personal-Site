- title: "My Runshaw App"
  status: "Ongoing"
  summary: "My largest project to date in both technical complexity and user adoption. This is a Flutter app I built after starting at college to help students with day-to-day actions like checking for buses and payment balance or sharing timetables. It quickly gained traction and ended up being used by almost every student."
  button_url: "https://apps.apple.com/gb/app/my-runshaw-unofficial/id6739817271"
  image: "content-res/images/runshaw-new-cover.png"
- title: "EchoCLI"
  status: "Complete (Archived)"
  summary: "A command-line tool for rooting echo dots. Written in python, this builds on the work of many others to provide a simple interface for rooting echo dots. Due to advances in reverse-engineering by the community, this tool is no longer needed, but it was a fun project to work on."
  button_url: "https://github.com/Dragon863/EchoCLI/"
  image: "content-res/images/root_cover.jpg"
- title: "Tizen-HA"
  status: "Complete"
  summary: "A Tizen app for controlling Home Assistant, created using the official flutter SDK variant for tizen with native bindings. This was my first flutter project and was a great way to learn the framework."
  button_url: "https://github.com/Dragon863/Tizen-HA/"
  image: "content-res/images/tizen-ha.png"
- title: "CFWatch"
  status: "Complete"
  summary: "My most advanced electronic engineering project - a custom PCB with a SAMD21 microcontroller and USB-C, designed to run for weeks on a rechargeable lithium coin cell. I plan to revisit this in the future"
  image: "https://raw.githubusercontent.com/Dragon863/CFWatch/refs/heads/main/_images/newrender.png"
  button_url: "https://github.com/Dragon863/CFWatch/"
- title: "BadAppleQR"
  status: "Complete"
  summary: "What if you fitted an entire website with bad apple encoded into a single QR code? This project does just that, and is a simple but fun way to learn about QR codes and how they work."
  image: "https://raw.githubusercontent.com/Dragon863/BadAppleQR/main/qr.png"
  button_url: "https://github.com/Dragon863/BadAppleQR/"
- title: "Droplet App"
  status: "Complete"
  summary: "I started droplet to learn more about how to plan and design UI before starting development, and to expand my flutter skills. Its concept is a simple and fun group for smaller friend groups."
  image: "content-res/images/droplet-cover.png"
  button_url: "https://github.com/Dragon863/Droplet/"
